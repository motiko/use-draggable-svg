<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />

    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/

    <!--

    <title>use-draggable-svg – React hook for draggable SVG elements</title>
    <meta
      name="description"
      content="use-draggable-svg is a small React hook that makes nested SVG elements draggable with mouse and touch. Live demo: drag the shapes, then install it from npm."
    />
    <link rel="canonical" href="https://motiko.github.io/use-draggable-svg/" />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <header style="padding:0 16px">
      <h1>use-draggable-svg</h1>
      <p>A React hook to drag SVG objects (an <code>svg</code> inside an <code>svg</code>) with mouse and touch. Drag the shapes below to try it.</p>
      <pre><code>npm install --save use-draggable-svg</code></pre>
      <p><a href="https://github.com/motiko/use-draggable-svg">Source and usage on GitHub</a></p>
    </header>
    <div id="root"></div>
